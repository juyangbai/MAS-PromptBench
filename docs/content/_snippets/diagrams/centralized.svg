<div class="diagram-wrap"><svg class="topo-diagram" style="--tc: var(--t-centralized)" viewBox="0 20 620 232" role="img" aria-label="Centralized topology: a manager delegates to three workers, collects their reports and answers." xmlns="http://www.w3.org/2000/svg"><rect class="io" x="15.0" y="41.0" width="74" height="34" rx="17"/><text x="52.0" y="62.5" text-anchor="middle">Task</text><path class="edge-io" d="M89.0 58.0 L230.5 58.0"/><path class="head-io" d="M238.0 58.0 L230.5 53.9 L230.5 62.1Z"/><rect class="node-strong" x="240.0" y="31.0" width="140" height="54" rx="12"/><text class="t-on" x="310.0" y="56.0" text-anchor="middle">Manager</text><text class="t-small t-on" x="310.0" y="71.0" text-anchor="middle">plans and delegates</text><rect class="node" x="142.0" y="169.0" width="96" height="42" rx="12"/><text x="190.0" y="194.5" text-anchor="middle">Worker 1</text><path class="edge" d="M264.0 86.0 L187.3 162.7"/><path class="head" d="M182.0 168.0 L190.2 165.6 L184.4 159.8Z"/><path class="edge" d="M198.0 168.0 L270.8 91.4"/><path class="head" d="M276.0 86.0 L267.8 88.6 L273.8 94.3Z"/><rect class="node" x="262.0" y="169.0" width="96" height="42" rx="12"/><text x="310.0" y="194.5" text-anchor="middle">Worker 2</text><path class="edge" d="M304.0 86.0 L302.2 160.5"/><path class="head" d="M302.0 168.0 L306.3 160.6 L298.1 160.4Z"/><path class="edge" d="M318.0 168.0 L316.2 93.5"/><path class="head" d="M316.0 86.0 L312.1 93.6 L320.3 93.4Z"/><rect class="node" x="382.0" y="169.0" width="96" height="42" rx="12"/><text x="430.0" y="194.5" text-anchor="middle">Worker 3</text><path class="edge" d="M344.0 86.0 L416.8 162.6"/><path class="head" d="M422.0 168.0 L419.8 159.7 L413.8 165.4Z"/><path class="edge" d="M438.0 168.0 L361.3 91.3"/><path class="head" d="M356.0 86.0 L358.4 94.2 L364.2 88.4Z"/><path class="edge-io" d="M380.0 58.0 L522.5 58.0"/><path class="head-io" d="M530.0 58.0 L522.5 53.9 L522.5 62.1Z"/><rect class="io" x="531.0" y="41.0" width="74" height="34" rx="17"/><text x="568.0" y="62.5" text-anchor="middle">Answer</text><text class="t-small" x="216" y="118" text-anchor="end">delegate ↓</text><text class="t-small" x="404" y="118" text-anchor="start">↑ report back</text><text class="t-small" x="310" y="240" text-anchor="middle">Workers never talk to each other · loops until the manager ends or a turn cap</text></svg></div>
