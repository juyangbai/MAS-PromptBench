name: mas-promptbench
channels:
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - numpy>=1.26
  - pandas>=2.2
  # CUDA toolchain (nvcc + headers) for flashinfer JIT compilation.
  - cuda-nvcc=12.8
  - cuda-cudart-dev=12.8
  - cuda-nvrtc-dev=12.8
  - cuda-cccl=12.8
  - pip:
      # Shared modern SDK baseline for langgraph + crewAI + autogen.
      - openai>=2.0.0,<3
      - pydantic>=2.11,<3
      - pydantic-settings>=2.10,<3
      - pyyaml>=6
      - httpx>=0.28,<0.29
      - tokenizers>=0.21,<1
      - chromadb>=1.1,<2
      - protobuf>=5.29,<6
      - langchain-core>=1.3.0a2,<2
      - langchain-openai>=1.0.0a,<2
      # HotpotQA retrieval tool.
      - wikipedia>=1.4,<2
      # Benchmark dataset loading.
      - datasets>=2.20,<4
      # SWE-bench official evaluation harness (Docker-based, optional).
      - swebench>=4.0,<5
      # BFCL official AST checker (pulls ~35 transitive deps; only
      # `ast_checker` + `MODEL_CONFIG_MAPPING` are actually used).
      - bfcl-eval>=2026.3.23
      # Prompt optimization (GEPA / MIPRO via DSPy; MAMUT-GEPA calls gepa directly).
      - dspy[optuna]==3.2.0
      - gepa==0.0.27
      # MASPOB baseline: GATv2 surrogate + MiniLM prompt embeddings (CPU is enough).
      - torch>=2.0
      - torch_geometric>=2.4
      - sentence-transformers>=3.0
      # Agent frameworks, pinned to the upstream commits the results were produced with.
      - "langgraph @ git+https://github.com/langchain-ai/langgraph.git@eae916719fe78de2900bb7cd45c212fffd64f88b#subdirectory=libs/langgraph"
      - "crewai @ git+https://github.com/crewAIInc/crewAI.git@2f48937ce41ef2fe91e40f17085418c5428a9393#subdirectory=lib/crewai"
      - "autogen-core @ git+https://github.com/microsoft/autogen.git@027ecf0a379bcc1d09956d46d12d44a3ad9cee14#subdirectory=python/packages/autogen-core"
      - "autogen-ext[openai] @ git+https://github.com/microsoft/autogen.git@027ecf0a379bcc1d09956d46d12d44a3ad9cee14#subdirectory=python/packages/autogen-ext"
      - "autogen-agentchat @ git+https://github.com/microsoft/autogen.git@027ecf0a379bcc1d09956d46d12d44a3ad9cee14#subdirectory=python/packages/autogen-agentchat"
      # Local model serving.
      - vllm>=0.19
