# Build the MkDocs tutorial from main and publish it to the `webpage` branch under docs/,
# so it is served at https://juyangbai.github.io/MAS-PromptBench/docs/ next to the project page.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs_theme/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build (fails on broken links or anchors)
        run: mkdocs build --strict --site-dir _site

      - name: Publish to webpage:/docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: webpage
          publish_dir: ./_site
          destination_dir: docs
          keep_files: false   # with destination_dir set, only docs/ is replaced
          commit_message: "docs: publish from ${{ github.sha }}"
